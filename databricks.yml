# This is a Databricks asset bundle definition for my_project.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: dbx_mlops
  uuid: 55d51430-7f6d-42c0-9173-08699505204c
  engine: direct

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://adb-7405609165985958.18.azuredatabricks.net
    variables:
      catalog: dbx
      schema: dev
  prod:
    mode: production
    workspace:
      host: https://adb-7405609165985958.18.azuredatabricks.net
      # We explicitly deploy to /Workspace/Users/vargabghoshasus@outlook.com to make sure we only have a single copy.
      root_path: /Workspace/Users/vargabghoshasus@outlook.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: dbx
      schema: prod
    permissions:
      - user_name: vargabghoshasus@outlook.com
        level: CAN_MANAGE
