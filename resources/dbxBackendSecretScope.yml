variables:
  scope_name:
    description: "Name for the secret scope."
  sp_application_id:
    description: "Application ID of the service principal that will have MANAGE permissions on the secret
  API_CLIENT_ID:
    description: "Client ID for the API."
  API_CLIENT_SECRET:
      description: "Client secret for the API."
      
resources:
  secret_scopes:
    data_product_scope:
      name: ${var.scope_name}
      # Existing permission support
      permissions:
        - level: MANAGE
          service_principal_name: ${var.sp_application_id}
      
      # PROPOSED: New secrets attribute
      secrets:
        - key: api_client_id
          value: ${env.API_CLIENT_ID}
        - key: api_client_secret
          value: ${env.API_CLIENT_SECRET}