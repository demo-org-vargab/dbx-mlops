variables:
  scope_name:
    description: "Name for the secret scope."
    default: "my-secret-scope"

  sp_application_id:
    description: "Application ID of the service principal that will have MANAGE permissions on the secret."
    default: "da085374-884f-47fc-8b3d-d7e6d96b53f6"
  API_CLIENT_ID:
    description: "Client ID for the API."
    default: ""

  API_CLIENT_SECRET:
    description: "Client secret for the API."
    default: ""

resources:
  secret_scopes:
    data_product_scope:
      name: ${var.scope_name}

      permissions:
        - level: MANAGE
          service_principal_name: ${var.sp_application_id}

      # secrets:
      #   - key: api_client_id
