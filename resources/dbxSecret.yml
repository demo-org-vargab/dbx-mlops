variables:
  API_KEY:
    description: "API key for accessing the Diabetes Prediction model."
    type: string
    sensitive: true

resources:
  secrets:
    my_secret:
      catalog_name: "workspace"
      schema_name: "my_project_dev"
      name: "api_key"
      value: ${var.API_KEY}
      comment: "This secret is used for accessing the API in the Diabetes Prediction model."